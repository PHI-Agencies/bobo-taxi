<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobo Taxi - Transport Communautaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
:root {
    --primary: #f1c40f; 
    --green: #27ae60;
    --dark: #121212;
    --card-bg: #1e1e1e;
    --text-light: #f4f4f4;
    --text-muted: #aaaaaa;
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--dark);
    background-image: radial-gradient(circle at 50% 0%, #2c3e50 0%, #121212 100%);
    color: var(--text-light);
    margin: 0;
    padding-bottom: 100px;
    overflow-x: hidden;
}

/* --- Header --- */
header {
    background: rgba(18, 18, 18, 0.95);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
    padding: 12px 15px;
    border-bottom: 1px solid #333;
}

.nav-container {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-small img { height: 35px; border-radius: 6px; border: 1px solid var(--primary); }

.search-box {
    flex-grow: 1;
    display: flex;
    align-items: center;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 30px;
    padding: 5px 15px;
}

.search-box input {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: white;
    padding: 8px 10px;
    outline: none;
    font-size: 0.9rem;
}

#open-menu {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 5px 0 5px 12px;
    display: flex;
    align-items: center;
    border-left: 1px solid #444;
    margin-left: 5px;
}

/* --- Animation LIVE --- */
.live-dot {
    height: 8px;
    width: 8px;
    background-color: var(--green);
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    box-shadow: 0 0 8px var(--green);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}

/* --- SIDE MENU --- */
#side-menu {
    position: fixed;
    top: 0;
    right: -300px;
    width: 280px;
    height: 100vh;
    background: #1e1e1e;
    z-index: 9999;
    transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    padding: 30px;
    box-sizing: border-box;
    box-shadow: -10px 0 30px rgba(0,0,0,0.8);
}

#side-menu.active { right: 0; }

#menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 9998;
    display: none;
}

.side-menu-content a {
    display: flex;
    align-items: center;
    gap: 15px;
    color: white;
    text-decoration: none;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 12px;
    background: rgba(255,255,255,0.05);
    transition: 0.3s;
}

/* --- Content Layout --- */
#main-content { max-width: 600px; margin: 0 auto; padding: 20px 15px; }

.request-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #333;
    border-left: 5px solid var(--primary);
    transition: transform 0.2s;
}

.btn-unlock {
    background: var(--primary);
    color: #121212;
    border: none;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    margin-top: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}

.floating-cta {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: white;
    padding: 16px 30px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    z-index: 900;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 10px 25px rgba(39, 174, 96, 0.4);
}

/* --- Skeleton Loader --- */
.skeleton-card {
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    height: 120px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.5; }
}
</style>
</head>
<body>

<header>
    <div class="nav-container">
        <div class="logo-small"><img src="taxi.jpg" alt="Logo"></div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="filter-input" placeholder="Chercher un quartier...">
            <button id="open-menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>
</header>

<div id="menu-overlay"></div>

<div id="side-menu">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:35px;">
        <h2 style="margin:0; font-size: 1.2rem; color: var(--primary);">BOBO TAXI</h2>
        <button id="close-menu" style="background:none; border:none; color:white; font-size:2.2rem; cursor:pointer;">&times;</button>
    </div>
    <div class="side-menu-content">
        <a href="index.html"><i class="fas fa-home"></i> Accueil</a>
        <a href="demande.html"><i class="fas fa-plus-circle"></i> Publier une demande</a>
        <a href="inscription.html" style="background: rgba(241, 196, 15, 0.1); border: 1px solid var(--primary); color: var(--primary);">
            <i class="fas fa-taxi"></i> Espace Chauffeur
        </a>
        <a href="site.html"><i class="fas fa-info-circle"></i> Infos & Aide</a>
    </div>
</div>

<main id="main-content">
    <div style="margin-bottom:25px;">
        <div style="display:inline-flex; align-items:center; padding:5px 0; margin-bottom:5px;">
            <span class="live-dot"></span>
            <span style="color:var(--green); font-size:0.75rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;">Demandes en direct</span>
        </div>
        <h1 style="font-size:1.6rem; margin:0; color:var(--text-light); font-weight:700;">Trouvez un trajet</h1>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-top:5px;">Mise à jour automatique • Bobo-Dioulasso</p>
    </div>

    <div id="active-requests-list">
        <!-- Skeleton loader initial -->
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
    </div>
</main>

<a href="demande.html" class="floating-cta">
    <i class="fas fa-paper-plane"></i> PUBLIER UNE DEMANDE
</a>

<script>
/* ================= MENU ================= */
const sideMenu = document.getElementById('side-menu');
const overlay = document.getElementById('menu-overlay');
const openBtn = document.getElementById('open-menu');
const closeBtn = document.getElementById('close-menu');

function toggleMenu(isOpen) {
  sideMenu.classList.toggle('active', isOpen);
  overlay.style.display = isOpen ? 'block' : 'none';
  document.body.style.overflow = isOpen ? 'hidden' : 'auto';
}

openBtn.addEventListener('click', () => toggleMenu(true));
closeBtn.addEventListener('click', () => toggleMenu(false));
overlay.addEventListener('click', () => toggleMenu(false));

/* ================= LOAD REQUESTS ================= */
async function loadRequests() {
  const listContainer = document.getElementById('active-requests-list');
  listContainer.innerHTML = `
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
    <div class="skeleton-card"></div>
  `;

  try {
    const response = await fetch('/api/requests');
    const requests = await response.json();

    if (!requests || requests.length === 0) {
      listContainer.innerHTML =
        '<p style="text-align:center; padding:40px; opacity:0.5;">Aucun trajet disponible.</p>';
      return;
    }

    listContainer.innerHTML = '';

    requests.forEach(req => {
      const now = new Date();
      const expireAt = new Date(req.expireAt);
      const diffMs = expireAt - now;
      if (diffMs <= 0) return;

      const diffMins = Math.ceil(diffMs / (1000 * 60));
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;

      const dateParts = req.date.split('-');
      const dateDisplay =
        dateParts.length === 3 ? `${dateParts[2]}/${dateParts[1]}` : req.date;

      const card = document.createElement('div');
      card.className = 'request-card';
      card.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-size:0.7rem; color:var(--primary); font-weight:bold;">
            ${req.type.toUpperCase()}
          </span>
          <span style="font-size:0.7rem; opacity:0.6;">
            ⏳ Expire dans ${hours}h ${mins}m
          </span>
        </div>

        <div style="font-weight:600; font-size:1.1rem; margin-bottom:12px;">
          📍 ${req.departure}
        </div>

        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <div style="flex:1; background:rgba(255,255,255,0.05); padding:6px; border-radius:8px; text-align:center; border:1px solid #333;">
            <div style="font-size:0.55rem; color:var(--text-muted);">DATE</div>
            <div style="font-size:0.85rem; font-weight:600; color:var(--primary);">${dateDisplay}</div>
          </div>
          <div style="flex:1; background:rgba(255,255,255,0.05); padding:6px; border-radius:8px; text-align:center; border:1px solid #333;">
            <div style="font-size:0.55rem; color:var(--text-muted);">HEURE</div>
            <div style="font-size:0.85rem; font-weight:600; color:var(--primary);">${req.time}</div>
          </div>
        </div>

        <p style="font-size:0.8rem; color:#888;">${req.description || ''}</p>

        <button class="btn-unlock" onclick="location.href='inscription.html'">
          <i class="fas fa-lock"></i> VOIR LE NUMÉRO
        </button>
      `;

      listContainer.appendChild(card);
    });

  } catch (err) {
    listContainer.innerHTML =
      '<p style="color:red; text-align:center;">Erreur serveur.</p>';
  }
}

/* ================= SEARCH ================= */
// On place la logique de filtrage dans une fonction réutilisable
function applySearchFilter() {
    const searchTerm = document.getElementById('filter-input').value.toLowerCase();
    const cards = document.querySelectorAll('.request-card');
    
    cards.forEach(card => {
        // On récupère le texte du quartier (le départ) spécifiquement pour plus de précision
        const content = card.textContent.toLowerCase();
        card.style.display = content.includes(searchTerm) ? 'block' : 'none';
    });
}

// Écouteur sur l'input de recherche
document.getElementById('filter-input').addEventListener('input', applySearchFilter);

/* ================= INIT & REFRESH ================= */
// On modifie légèrement loadRequests pour ré-appliquer le filtre après le chargement
async function loadRequests() {
    // ... votre code fetch existant ...
    
    // À la fin de votre fonction loadRequests actuelle, juste après la boucle forEach :
    // applySearchFilter(); 
}

// Lancement initial
loadRequests();

// Auto-refresh toutes les 60 secondes
setInterval(async () => {
    await loadRequests();
    applySearchFilter(); // Ré-applique la recherche après la mise à jour
}, 60000);
