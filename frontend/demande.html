<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publier une demande - Bobo Taxi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    :root {
      --taxi-yellow: #f1c40f;
      --taxi-green: #27ae60;
      --taxi-dark: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #2a2a2a;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--taxi-dark);
      background-image: radial-gradient(circle at 50% 0%, #2c3e50 0%, #121212 100%);
      color: white;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* --- Navigation --- */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .app-logo-img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      border: 2px solid var(--taxi-yellow);
    }

    /* --- Formulaire --- */
    .form-container {
      max-width: 450px;
      margin: 10px auto 40px;
      padding: 25px;
      background: var(--card-bg);
      border-radius: 25px;
      border: 1px solid #333;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    h2 {
      color: var(--taxi-yellow);
      margin: 0 0 10px 0;
      font-size: 1.5rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      margin-bottom: 8px;
      color: var(--taxi-green);
      font-weight: 600;
      text-transform: uppercase;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 20px;
      background: var(--input-bg);
      border: 1px solid #444;
      border-radius: 12px;
      color: white;
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--taxi-yellow);
    }

    /* --- Dates & Heures Groupées --- */
    .flex-row {
      display: flex;
      gap: 10px;
      margin-bottom: 5px;
    }

    .flex-row div {
      flex: 1;
    }

    button[type="submit"] {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, var(--taxi-green), #1e8449);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(39, 174, 96, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    #request-message {
      text-align: center;
      margin-top: 15px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      padding: 20px;
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <a href="index.html" class="btn-back">
        <i class="fas fa-arrow-left"></i>
      </a>
      <img src="taxi.jpg" alt="Logo Bobo Taxi" class="app-logo-img">
      <div style="width: 40px;"></div>
    </nav>
  </header>

  <main>
    <div class="form-container">
      <h2>Publier une demande</h2>
      <p class="subtitle">Précisez la date et l'heure pour aider nos chauffeurs à s'organiser.</p>
      
      <form id="create-request-form">
        <label for="transport-type"><i class="fas fa-car"></i> Moyen de transport</label>
        <select id="transport-type" required>
          <option value="Taxi-voiture">Taxi-voiture</option>
          <option value="Moto-taxi" selected>Moto-taxi</option>
        </select>

        <label for="itinerary"><i class="fas fa-map-marker-alt"></i> Itinéraire (D'où à où ?)</label>
        <textarea id="itinerary" rows="2" required placeholder="Ex: De Tounouma vers Grand Marché"></textarea>

        <div class="flex-row">
          <div>
            <label for="departure-date"><i class="fas fa-calendar-alt"></i> Date</label>
            <input type="date" id="departure-date" required>
          </div>
          <div>
            <label for="departure-time"><i class="fas fa-clock"></i> Heure</label>
            <input type="time" id="departure-time" required>
          </div>
        </div>

        <label for="validity-duration"><i class="fas fa-hourglass-half"></i> Maintenir l'annonce pendant</label>
        <select id="validity-duration" required>
          <option value="12">12 heures</option>
          <option value="24" selected>24 heures (Conseillé)</option>
          <option value="48">48 heures</option>
        </select>

        <label for="contact-info"><i class="fas fa-phone-alt"></i> Votre numéro (WhatsApp ou Appel)</label>
        <input type="tel" id="contact-info" required placeholder="Ex: 70 00 00 00">

        <label for="comments"><i class="fas fa-info-circle"></i> Précisions (Facultatif)</label>
        <textarea id="comments" rows="2" placeholder="Ex: Nous sommes deux personnes..."></textarea>

        <button type="submit">Lancer la demande <i class="fas fa-paper-plane"></i></button>
        <p id="request-message"></p>
      </form>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 QRPHI - Bobo Taxi Service</p>
  </footer>

  <script>
    // Initialisation automatique de la date à "Aujourd'hui"
    document.addEventListener('DOMContentLoaded', () => {
      const dateInput = document.getElementById('departure-date');
      const today = new Date().toISOString().split('T')[0];
      dateInput.value = today;
      dateInput.min = today; // Empêche de choisir une date passée
    });

    // Envoi du formulaire vers l'API
    const form = document.getElementById('create-request-form');
    const msg = document.getElementById('request-message');

    form.onsubmit = async (e) => {
        e.preventDefault();
        msg.innerText = "Envoi en cours...";
        msg.style.color = "var(--taxi-yellow)";

        const data = {
            type: document.getElementById('transport-type').value,
            departure: document.getElementById('itinerary').value,
            destination: "", // Optionnel selon ton schéma
            date: document.getElementById('departure-date').value,
            time: document.getElementById('departure-time').value,
            duration: document.getElementById('validity-duration').value,
            contact: document.getElementById('contact-info').value,
            description: document.getElementById('comments').value
        };

        try {
            const response = await fetch('/api/requests', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (response.ok) {
                msg.innerText = "Demande publiée avec succès !";
                msg.style.color = "var(--taxi-green)";
                setTimeout(() => window.location.href = 'index.html', 2000);
            } else {
                msg.innerText = "Erreur lors de la publication.";
                msg.style.color = "red";
            }
        } catch (err) {
            msg.innerText = "Erreur de connexion au serveur.";
            msg.style.color = "red";
        }
    };
  </script>
</body>
</html>
