<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chauffeurs Actifs - Bobo Taxi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --taxi-yellow: #f1c40f;
            --taxi-green: #27ae60;
            --taxi-dark: #121212;
            --card-bg: #1e1e1e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--taxi-dark);
            background-image: radial-gradient(circle at 50% 0%, #2c3e50 0%, #121212 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        /* --- Bouton Retour --- */
        .back-nav {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }

        .btn-back:hover {
            background: var(--taxi-yellow);
            color: var(--taxi-dark);
            transform: scale(1.1);
        }

        header {
            text-align: center;
            padding: 10px 0 30px;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid var(--taxi-yellow);
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }

        .logo-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--taxi-yellow);
            margin: 5px 0 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-header {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid var(--taxi-green);
            padding: 6px 16px;
            border-radius: 30px;
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--taxi-green);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: var(--taxi-green);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(39, 174, 96, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0px rgba(39, 174, 96, 0); }
        }

        .chauffeurs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .chauffeur-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 10px;
            text-align: center;
            position: relative;
            border: 1px solid #333;
        }

        .avatar-img {
            width: 60px;
            height: 60px;
            background: #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 1.5rem;
            color: var(--taxi-yellow);
            border: 2px solid #444;
        }

        .name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
        .code-tag { font-size: 0.7rem; color: var(--taxi-yellow); background: #333; padding: 2px 8px; border-radius: 4px; }

        .btn-contact {
            margin-top: 15px;
            display: inline-block;
            background: var(--taxi-green);
            color: white;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <nav class="back-nav">
        <a href="index.html" class="btn-back">
            <i class="fas fa-arrow-left"></i>
        </a>
    </nav>

    <header>
        <div class="logo-container">
            <img src="taxi.jpg" alt="Logo Bobo Taxi" class="logo-img">
        </div>
        <h1 class="logo-title">Bobo Taxi</h1>
        <div class="status-header">
            <div class="pulse"></div>
            <span id="active-count">Chauffeurs en ligne...</span>
        </div>
    </header>

    <div class="chauffeurs-grid" id="chauffeurs-list">
        </div>

    <script>
        async function loadActiveChauffeurs() {
            try {
                const res = await fetch('/api/taximan/active-list');
                const taximen = await res.json();
                const list = document.getElementById('chauffeurs-list');
                const countText = document.getElementById('active-count');
                
                list.innerHTML = '';
                countText.innerText = `${taximen.length} CHAUFFEURS ACTIFS`;

                taximen.forEach(taxi => {
                    const card = document.createElement('div');
                    card.className = 'chauffeur-card';
                    card.innerHTML = `
                        <div class="avatar-img"><i class="fas fa-user"></i></div>
                        <div class="name">${taxi.name}</div>
                        <div class="code-tag">CODE: ${taxi.referralCode}</div>
                        <a href="tel:${taxi.phone}" class="btn-contact">
                            <i class="fas fa-phone-alt"></i> APPELER
                        </a>
                    `;
                    list.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }
        window.onload = loadActiveChauffeurs;
    </script>
</body>
</html>
